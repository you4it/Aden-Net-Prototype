<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 85" width="220" height="60" fill="none">
  <defs>
    <linearGradient id="anCableGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c6b70"/>
      <stop offset="100%" stop-color="#12c1c7"/>
    </linearGradient>
    <linearGradient id="anSkyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19dbe2"/>
      <stop offset="100%" stop-color="#0fa1a6"/>
    </linearGradient>
    <linearGradient id="anAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc84a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#12c1c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- أيقونة الشعار: الكابل البحري (المنحنى السفلي) + البث اللاسلكي الفضائي (المنحنى العلوي) مع تبادل البيانات -->
  <g transform="translate(10, 8)" filter="url(#glow)">
    <!-- القوس السفلي: اختراق الكابل البحري للبحار -->
    <path d="M 12,50 C 22,58 48,58 60,42 C 68,32 76,28 84,30" 
          stroke="url(#anCableGrad)" stroke-width="7" stroke-linecap="round"/>
          
    <!-- القوس العلوي: البث اللاسلكي في السماء عبر 4G -->
    <path d="M 22,22 C 38,10 65,14 74,28 C 80,38 88,42 96,40" 
          stroke="url(#anSkyGrad)" stroke-width="7" stroke-linecap="round"/>
          
    <!-- أمواج الإشارة اللاسلكية العلوية -->
    <path d="M 44,8 A 24,24 0 0,1 68,14" stroke="#19dbe2" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M 49,3 A 32,32 0 0,1 78,11" stroke="#fab641" stroke-width="3" stroke-linecap="round"/>

    <!-- نقطة مركز البيانات الذهبية (حلقة الربط والتبادل) -->
    <circle cx="58" cy="35" r="5.5" fill="url(#anAccentGrad)"/>
    <circle cx="58" cy="35" r="9" stroke="url(#anSkyGrad)" stroke-width="2" opacity="0.6" stroke-dasharray="2 2"/>
  </g>

  <!-- النصوص: عدن نت + ADEN NET + 4G LTE -->
  <g transform="translate(118, 0)">
    <!-- النص العربي: عدن نت بخط عريض أصيل متطابق مع هوية الموقع -->
    <text x="0" y="42" font-family="'Cairo', 'Tajawal', 'Arial Black', sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5">
      <tspan fill="#0c6b70">عدن</tspan>
      <tspan fill="#12c1c7"> نت</tspan>
    </text>

    <!-- شارة الجيل الرابع 4G LTE الذهبية الرسمية -->
    <rect x="118" y="21" width="46" height="20" rx="5" fill="url(#anAccentGrad)"/>
    <text x="141" y="35" font-family="'Arial Black', sans-serif" font-weight="900" font-size="11" fill="#094548" text-anchor="middle">4G</text>

    <!-- النص الإنجليزي الرسمي أسفل الشعار ADEN NET -->
    <text x="2" y="60" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="11" fill="#64748b" letter-spacing="4">
      ADEN NET
    </text>
    <text x="96" y="60" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="9" fill="#12c1c7" letter-spacing="1">
      LTE
    </text>
  </g>
</svg>
